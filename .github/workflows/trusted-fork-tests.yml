name: 'Trusted fork tests'

run-name: >-
  PR #${{ github.event.pull_request.number }} ·
  ${{ github.event.action == 'closed' && 'Fork test cleanup' || 'Prepare fork Playwright' }}

# Fork pull_request workflows intentionally receive no repository secrets. This
# privileged broker makes an exact fork revision reachable through an internal
# CI ref, but dispatches the trusted workflow definition from main and never
# executes contributor code itself. The private Playwright job is released only
# after approval through the trusted-fork-tests environment.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, closed]

permissions: {}

concurrency:
  group: trusted-fork-broker-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:

  dispatch:
    name: 'Prepare fork tests'
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Dispatch exact fork revision
        uses: actions/github-script@v9
        with:
          script: |
            const { data: pull } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: context.payload.pull_request.number,
            });

            if (pull.state !== 'open' || !pull.head.repo) {
              core.setFailed('The pull request must be open and its head repository must be available.');
              return;
            }

            if (pull.head.repo.full_name === `${context.repo.owner}/${context.repo.repo}`) {
              core.notice(`PR #${pull.number} is not from a fork; its normal pull_request workflow is sufficient.`);
              return;
            }

            const shortSha = pull.head.sha.slice(0, 7);
            const commitUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${pull.head.sha}`;
            const brokerUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const marker = '<!-- trusted-fork-tests -->';
            let statusComment;

            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: pull.number,
              per_page: 100,
            });
            statusComment = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' &&
              comment.body?.includes(marker)
            );

            const setStatus = async lines => {
              const body = [marker, ...lines].join('\n');

              if (statusComment) {
                const { data } = await github.rest.issues.updateComment({
                  ...context.repo,
                  comment_id: statusComment.id,
                  body,
                });
                statusComment = data;
              } else {
                const { data } = await github.rest.issues.createComment({
                  ...context.repo,
                  issue_number: pull.number,
                  body,
                });
                statusComment = data;
              }
            };

            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo,
              pull_number: pull.number,
              per_page: 100,
            });
            const changedPaths = files.flatMap(file =>
              [file.filename, file.previous_filename].filter(Boolean)
            );
            const workflowChanges = changedPaths.filter(filename =>
              filename.startsWith('.github/workflows/')
            );

            const { data: confirmedPull } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: pull.number,
            });

            if (confirmedPull.state !== 'open' || confirmedPull.head.sha !== pull.head.sha) {
              core.notice(`PR #${pull.number} changed while it was being prepared; the synchronize event will test the new revision.`);
              return;
            }

            if (workflowChanges.length > 0) {
              await setStatus([
                '### Trusted fork tests',
                '',
                `⛔ Tests were not started for [\`${shortSha}\`](${commitUrl}) because this PR changes GitHub Actions workflow files.`,
                '',
                'Privileged testing requires those workflow changes to be reviewed and merged separately.',
                '',
                `[View broker details](${brokerUrl})`,
              ]);
              core.setFailed(`Refusing privileged tests because the PR changes workflow files: ${workflowChanges.join(', ')}`);
              return;
            }

            // Match tests.yml's source paths. Workflow changes are refused above.
            const testDirectories = ['src/', 'lib/', 'dist/', 'tests/Unit/', 'tests/Playwright/'];
            const requiresTests = changedPaths.some(filename =>
              filename === 'composer.json' ||
              testDirectories.some(directory => filename.startsWith(directory))
            );

            if (!requiresTests) {
              await setStatus([
                '### Trusted fork tests',
                '',
                `ℹ️ Private Playwright tests are not needed for [\`${shortSha}\`](${commitUrl}) because this PR does not change tested files.`,
              ]);
              core.notice(`PR #${pull.number} does not change tested files; no private tests were dispatched.`);
              return;
            }

            await setStatus([
              '### Trusted fork tests',
              '',
              `⏳ Preparing private Playwright tests for [\`${shortSha}\`](${commitUrl}).`,
            ]);

            const branch = `ci/pr-${pull.number}`;
            const ref = `heads/${branch}`;

            try {
              try {
                const { data: current } = await github.rest.git.getRef({
                  ...context.repo,
                  ref,
                });

                if (current.object.sha !== pull.head.sha) {
                  await github.rest.git.updateRef({
                    ...context.repo,
                    ref,
                    sha: pull.head.sha,
                    force: true,
                  });
                }
              } catch (error) {
                if (error.status !== 404) throw error;

                await github.rest.git.createRef({
                  ...context.repo,
                  ref: `refs/${ref}`,
                  sha: pull.head.sha,
                });
              }

              await github.rest.actions.createWorkflowDispatch({
                ...context.repo,
                workflow_id: 'tests.yml',
                ref: 'main',
                inputs: {
                  checkout_ref: pull.head.sha,
                  trusted_pr_number: String(pull.number),
                },
              });

              const runsUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/workflows/tests.yml?query=${encodeURIComponent('branch:main event:workflow_dispatch')}`;
              await setStatus([
                '### Trusted fork tests',
                '',
                `⏳ Private Playwright tests are awaiting approval for [\`${shortSha}\`](${commitUrl}).`,
                '',
                'The private Hyvä Playwright job requires maintainer approval in the `trusted-fork-tests` environment. Unit tests and production builds run separately in the normal PR workflow.',
                '',
                `[Review and follow the workflow run](${runsUrl})`,
              ]);

              core.notice(`Dispatched private Playwright tests from main for PR #${pull.number} at ${pull.head.sha}.`);
            } catch (error) {
              await setStatus([
                '### Trusted fork tests',
                '',
                `❌ Private Playwright tests could not be started for [\`${shortSha}\`](${commitUrl}).`,
                '',
                `[Review the broker run](${brokerUrl}), then re-run it or push a new commit to try again.`,
              ]);
              throw error;
            }

  cleanup:
    name: 'Cancel fork tests and remove CI ref'
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: read
    steps:
      - name: Cancel trusted runs and delete temporary PR refs
        uses: actions/github-script@v9
        with:
          script: |
            const pullNumber = context.payload.pull_request.number;
            const { data: pull } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: pullNumber,
            });

            if (pull.state !== 'closed') {
              core.notice(`PR #${pullNumber} was reopened; keeping its trusted tests and CI ref.`);
              return;
            }

            const prefixes = [
              `Trusted fork PR #${pullNumber} @ `,
              `PR #${pullNumber} · Approved Playwright · `,
            ];
            const runs = (await Promise.all(
              ['queued', 'in_progress', 'waiting', 'pending', 'requested'].map(status =>
                github.paginate(github.rest.actions.listWorkflowRuns, {
                  ...context.repo,
                  workflow_id: 'tests.yml',
                  branch: 'main',
                  event: 'workflow_dispatch',
                  status,
                  per_page: 100,
                })
              )
            )).flat();
            const runIds = new Set(runs.filter(run =>
              prefixes.some(prefix => run.display_title.startsWith(prefix))
            ).map(run => run.id));

            for (const runId of runIds) {
              try {
                await github.rest.actions.cancelWorkflowRun({
                  ...context.repo,
                  run_id: runId,
                });
                core.notice(`Cancelled trusted tests for closed PR #${pullNumber}: run ${runId}.`);
              } catch (error) {
                if (error.status !== 409) throw error;
                core.notice(`Run ${runId} already finished or was cancelled.`);
              }
            }

            const exactRef = `refs/heads/ci/pr-${pullNumber}`;
            const legacyPrefix = `${exactRef}-comment-`;
            const refs = await github.paginate(github.rest.git.listMatchingRefs, {
              ...context.repo,
              ref: `heads/ci/pr-${pullNumber}`,
              per_page: 100,
            });
            const temporaryRefs = refs.filter(reference =>
              reference.ref === exactRef || reference.ref.startsWith(legacyPrefix)
            );

            for (const reference of temporaryRefs) {
              await github.rest.git.deleteRef({
                ...context.repo,
                ref: reference.ref.replace(/^refs\//, ''),
              });
            }

            core.notice(`Removed ${temporaryRefs.length} temporary ref(s) for PR #${pullNumber}.`);
