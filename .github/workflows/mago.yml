name: 'Mago'

run-name: >-
  ${{ github.event.pull_request.number &&
  format('PR #{0} · Mago', github.event.pull_request.number) ||
  format('{0} · Mago', github.ref_name) }}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: mago-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  mago:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Mago
        env:
          MAGO_VERSION: '1.27.1'
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://carthage.software/mago.sh | bash -s -- --no-verify --version="$MAGO_VERSION"
          mago --version

      - name: Strip external includes from mago.toml
        run: sed -i '/^includes\s*=/d' mago.toml

      - name: Mago lint
        run: mago lint --reporting-format=github

      - name: Mago format check
        run: mago format --check
