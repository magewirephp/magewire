name: 'Tests'

run-name: >-
  ${{ inputs.trusted_pr_number != '' &&
  format('Trusted fork PR #{0} @ {1}', inputs.trusted_pr_number, inputs.checkout_ref) ||
  github.event.pull_request.title ||
  github.event.head_commit.message ||
  'Tests' }}

on:
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: 'Optional commit SHA to test instead of the workflow ref.'
        required: false
        type: string
        default: ''
      trusted_pr_number:
        description: 'Fork PR number requiring environment approval.'
        required: false
        type: string
        default: ''
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'lib/**'
      - 'dist/**'
      - 'composer.json'
      - 'tests/Unit/**'
      - 'tests/Playwright/**'
      - '.github/workflows/tests.yml'
      - '.github/workflows/unit-tests.yml'
      - '.github/workflows/production-build.yml'
      - '.github/workflows/playwright.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'lib/**'
      - 'dist/**'
      - 'composer.json'
      - 'tests/Unit/**'
      - 'tests/Playwright/**'
      - '.github/workflows/tests.yml'
      - '.github/workflows/unit-tests.yml'
      - '.github/workflows/production-build.yml'
      - '.github/workflows/playwright.yml'

permissions:
  contents: read

concurrency:
  group: tests-${{ inputs.trusted_pr_number || github.ref }}
  cancel-in-progress: true

jobs:

  unit-tests:
    name: 'Unit tests'
    uses: ./.github/workflows/unit-tests.yml
    with:
      checkout_ref: ${{ inputs.checkout_ref }}

  production-build:
    name: 'Production build'
    uses: ./.github/workflows/production-build.yml
    with:
      checkout_ref: ${{ inputs.checkout_ref }}

  approve-trusted-playwright:
    name: 'Approve fork Playwright'
    # SECURITY: this environment must exist with required reviewers configured.
    # GitHub creates a missing environment without protection rules.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.trusted_pr_number != '' &&
      inputs.checkout_ref != ''
    runs-on: ubuntu-latest
    environment:
      name: trusted-fork-tests
    steps:
      - name: Record approval
        run: echo "Approved private Playwright tests for ${{ inputs.checkout_ref }}."

  playwright:
    name: 'Playwright'
    # Fork PRs cannot access the private Hyvä credentials. Their mirrored CI ref
    # is handled by trusted-playwright after environment approval instead.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' &&
      inputs.trusted_pr_number == '')
    uses: ./.github/workflows/playwright.yml
    with:
      checkout_ref: ${{ inputs.checkout_ref }}
    secrets:
      HYVA_COMPOSER_REPO_URL: ${{ secrets.HYVA_COMPOSER_REPO_URL }}
      HYVA_COMPOSER_AUTH_TOKEN: ${{ secrets.HYVA_COMPOSER_AUTH_TOKEN }}

  trusted-playwright:
    name: 'Playwright (approved fork)'
    needs: approve-trusted-playwright
    if: needs.approve-trusted-playwright.result == 'success'
    uses: ./.github/workflows/playwright.yml
    with:
      checkout_ref: ${{ inputs.checkout_ref }}
    secrets:
      HYVA_COMPOSER_REPO_URL: ${{ secrets.HYVA_COMPOSER_REPO_URL }}
      HYVA_COMPOSER_AUTH_TOKEN: ${{ secrets.HYVA_COMPOSER_AUTH_TOKEN }}
