name: 'Tests'

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'lib/**'
      - 'dist/**'
      - 'composer.json'
      - 'tests/Unit/**'
      - 'tests/Playwright/**'
      - '.github/workflows/tests.yml'
      - '.github/workflows/unit-tests.yml'
      - '.github/workflows/production-build.yml'
      - '.github/workflows/playwright.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'lib/**'
      - 'dist/**'
      - 'composer.json'
      - 'tests/Unit/**'
      - 'tests/Playwright/**'
      - '.github/workflows/tests.yml'
      - '.github/workflows/unit-tests.yml'
      - '.github/workflows/production-build.yml'
      - '.github/workflows/playwright.yml'

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:

  unit-tests:
    name: 'Unit tests'
    uses: ./.github/workflows/unit-tests.yml

  production-build:
    name: 'Production build'
    uses: ./.github/workflows/production-build.yml

  playwright:
    name: 'Playwright'
    # Fork PRs cannot access the private Hyvä credentials. A maintainer can run
    # this suite for their exact head SHA by commenting `/test` on the PR.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/playwright.yml
    secrets:
      HYVA_COMPOSER_REPO_URL: ${{ secrets.HYVA_COMPOSER_REPO_URL }}
      HYVA_COMPOSER_AUTH_TOKEN: ${{ secrets.HYVA_COMPOSER_AUTH_TOKEN }}
